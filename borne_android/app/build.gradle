plugins {
    id "com.android.application"
}

android {
    namespace "mg.smiefuntoa.borne"
    compileSdk 34

    defaultConfig {
        applicationId "mg.smiefuntoa.borne"
        minSdk 24          // Android 7.0 et plus
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Aucune dépendance externe : seulement le SDK Android (application légère).
