{# Zone unique des messages : remplacée aussi lors des actions HTMX (hx-swap-oob). Avec JavaScript, ils s'affichent en notifications (static/js/app.js). #}
<ul class="messages" id="messages-page"{% if oob %} hx-swap-oob="true"{% endif %} data-toasts>{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul>
