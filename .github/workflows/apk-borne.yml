# Compile l'application Android de la borne (borne_android/) et met l'APK
# à disposition dans l'onglet « Actions » de GitHub (artefact « borne-funtoa-apk »).
# Aucun outil Android n'est nécessaire sur le PC.
name: APK borne Android

on:
  push:
    paths:
      - "borne_android/**"
      - ".github/workflows/apk-borne.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: borne_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: borne-funtoa-apk
          path: borne_android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
