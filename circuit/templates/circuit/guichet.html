{% extends "base.html" %}
{% block titre %}{{ service.nom }}{% endblock %}
{% block contenu %}
<div class="ligne" style="justify-content:space-between">
    <h1>{{ service.nom }}{% if files|length > 1 %} · {{ file.nom }}{% endif %}</h1>
    {% if files|length > 1 %}
    <form method="get" class="ligne">
        <select name="file" onchange="this.form.submit()">
            {% for f in files %}<option value="{{ f.pk }}" {% if f.pk == file.pk %}selected{% endif %}>{{ f.nom }}</option>{% endfor %}
        </select>
    </form>
    {% endif %}
</div>
<div id="zone-guichet">
    {% include "circuit/_zone_guichet.html" %}
</div>
{% endblock %}
