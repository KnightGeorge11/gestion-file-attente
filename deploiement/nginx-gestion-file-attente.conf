# Nginx devant Gunicorn (serveur Ubuntu). Voir docs/DEPLOIEMENT_UBUNTU.md.
#   sudo cp deploiement/nginx-gestion-file-attente.conf /etc/nginx/sites-available/gestion-file-attente
#   sudo ln -s /etc/nginx/sites-available/gestion-file-attente /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remplacer 192.168.1.10 et serveur-files.local par l'adresse et le nom du serveur.

# HTTP : redirection vers HTTPS.
server {
    listen 80;
    server_name 192.168.1.10 serveur-files.local;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 (Nginx 1.24) : syntaxe « listen … http2 ».
    listen 443 ssl http2;
    server_name 192.168.1.10 serveur-files.local;

    # Certificat signé par l'autorité locale du centre (docs/DEPLOIEMENT_UBUNTU.md, étape 6).
    ssl_certificate     /etc/ssl/gfa/serveur.crt;
    ssl_certificate_key /etc/ssl/gfa/serveur.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Adresse réelle du client : lue par l'application seulement parce
        # que 127.0.0.1 figure dans DJANGO_PROXIES_CONFIANCE.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
